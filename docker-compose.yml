version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: smart-accident-mysql
    restart: always
    environment:
      MYSQL_DATABASE: smart_accident_v2
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - npm_network

  web:
    build: .
    container_name: smart-accident-web
    restart: always
    depends_on:
      - db
    ports:
      - "8050:8000"
    environment:
      SECRET_KEY: django-secret-key-development
      DEBUG: "False"
      DB_NAME: smart_accident_v2
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_HOST: db
      DB_PORT: 3306
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - npm_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smart-accident-phpmyadmin
    restart: always
    depends_on:
      - db
    ports:
      - "8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - npm_network

volumes:
  mysql_data:

networks:
  npm_network:
    external: true
